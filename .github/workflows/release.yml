name: Build and Release

on:
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build plugin jar
        run: ./gradlew jar --no-daemon

      - name: Read version
        id: version
        run: echo "version=$(grep 'val baseVersion' build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenRune-Developer-Tools v${{ steps.version.outputs.version }}
          files: build/libs/OpenRune-Developer-Tools.jar
          generate_release_notes: true
